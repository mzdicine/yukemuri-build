<!doctype html>
<html lang="zh-CN" data-layout="landscape">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a120c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow">
<title>湯けむり裏返し</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=0.1.0+202611041905.3c17de57">
<link rel="stylesheet" href="portrait.css?v=0.1.0+202611041905.3c17de57">
</head>
<body>
<div id="app">
  <div id="stage" aria-label="游戏画面">
    <!-- 图像层容器：背景/立绘/CG/差分层/tint/画面特效。只放图像，文字和 UI 一律放在它外面（防偷窥模式只压暗这里） -->
    <div id="stage-img">
      <div id="layer-bg" class="layer"></div>
      <div id="layer-chars" class="layer"></div>
      <div id="layer-steam" class="layer" aria-hidden="true"></div>
      <div id="layer-cg" class="layer"></div>
      <div id="hfx" aria-hidden="true"></div>
      <div id="layer-fx" class="layer"><div id="vignette"></div><div id="flash"></div><div id="curtain"></div></div>
    </div>
    <div id="hud"></div>
    <div id="danger-meter"><div class="fill"></div></div>
    <div id="ui">
      <div id="textbox"></div>
      <div id="namebox"><span></span></div>
      <div id="text"><span class="body"></span><i class="next"></i></div>
      <div id="quick"></div>
    </div>
    <div id="choices"></div>
    <div id="screens"></div>
    <div id="toast"></div>
  </div>
  <div id="rotate"><div>请横过手机 🔄 体验更佳</div></div>
  <noscript>需要启用 JavaScript。</noscript>
</div>
<!-- 18+ 确认（E-agegate）：首次打开盖在最上层；选「是」记 localStorage 不再弹，选「否」跳 about:blank -->
<div id="agegate" role="dialog" aria-modal="true" aria-labelledby="agegate-q" hidden style="position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;background:#1a120c;color:#f3e6d6;font:18px/1.7 system-ui,'PingFang SC','Noto Sans CJK SC',sans-serif;text-align:center;padding:24px">
  <div><p id="agegate-q" style="margin:0 0 28px">本作含成人内容，所有角色均为成年人。<br>你已满 18 岁吗？</p>
  <button id="agegate-yes" type="button" style="font:inherit;margin:6px 10px;padding:10px 28px;border-radius:8px;border:1px solid #d9a26b;background:#d9a26b;color:#1a120c;cursor:pointer">是，进入</button>
  <button id="agegate-no" type="button" style="font:inherit;margin:6px 10px;padding:10px 28px;border-radius:8px;border:1px solid #8a7a6a;background:transparent;color:#f3e6d6;cursor:pointer">否，离开</button></div>
</div>
<script>
(function () {
  var K = 'onsen_age18_ok', ok = false;
  try { ok = localStorage.getItem(K) === '1'; } catch (e) {}
  if (ok) return;
  var g = document.getElementById('agegate'); g.hidden = false;
  // 盖住期间：门外的点击/按键在捕获阶段拦掉；门内的事件不冒泡到引擎（免得 Enter/空格推进剧情）
  var block = function (e) { if (!g.hidden && !g.contains(e.target)) { e.stopImmediatePropagation(); e.preventDefault(); } };
  ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'click', 'touchstart', 'touchend', 'wheel', 'contextmenu', 'keydown', 'keyup'].forEach(function (t) {
    window.addEventListener(t, block, { capture: true, passive: false });
    g.addEventListener(t, function (e) { e.stopPropagation(); });
  });
  document.getElementById('agegate-yes').onclick = function () { try { localStorage.setItem(K, '1'); } catch (e) {} g.hidden = true; g.style.display = 'none'; };
  document.getElementById('agegate-no').onclick = function () { location.replace('about:blank'); };
  setTimeout(function () { document.getElementById('agegate-yes').focus(); }, 0);
})();
</script>
<script type="module" src="main.js?v=0.1.0+202611041905.3c17de57"></script>
</body>
</html>
